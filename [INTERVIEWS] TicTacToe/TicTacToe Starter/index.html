<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Tic Tac Toe</title>
  </head>
  <body>
    <div>
      <h1 class="board__title">X's Turn</h1>
      <div class="board__wrapper">
        <button class="board__square" onclick="placeTurn(0)"></button>
        <button class="board__square" onclick="placeTurn(1)"></button>
        <button class="board__square" onclick="placeTurn(2)"></button>
        <button class="board__square" onclick="placeTurn(3)"></button>
        <button class="board__square" onclick="placeTurn(4)"></button>
        <button class="board__square" onclick="placeTurn(5)"></button>
        <button class="board__square" onclick="placeTurn(6)"></button>
        <button class="board__square" onclick="placeTurn(7)"></button>
        <button class="board__square" onclick="placeTurn(8)"></button>
      </div>
      <button class="restart" onclick="resetGame()">Restart Game</button>
    </div>

    <script src="script.js"></script>
  </body>
</html>
